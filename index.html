<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际引力 | 我的太空主页</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景流星动画 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat;
            z-index: 0;
        }

        /* 导航栏 */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            background: rgba(9, 10, 15, 0.6);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
            letter-spacing: 2px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            transition: color 0.3s;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: #00e5ff;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }

        /* 主体内容容器 */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 150px 20px 60px;
            position: relative;
            z-index: 10;
        }

        /* 欢迎区域 */
        .hero-section {
            text-align: center;
            margin-bottom: 100px;
        }

        .hero-section h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00e5ff, #bd00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
        }

        .hero-section p {
            font-size: 1.2rem;
            color: #a0aec0;
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        .cta-btn {
            display: inline-block;
            padding: 12px 35px;
            background: transparent;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background: #00e5ff;
            color: #090a0f;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
            transform: translateY(-3px);
        }

        /* 模块卡片布局 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #bd00ff;
            box-shadow: 0 10px 30px rgba(189, 0, 255, 0.2);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: inline-block;
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .card p {
            color: #a0aec0;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #4a5568;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            position: relative;
            z-index: 10;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            header { padding: 20px; }
            nav a { margin-left: 15px; font-size: 0.8rem; }
            .hero-section h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <header>
        <div class="logo">NEBULA.IO</div>
        <nav>
            <a href="#home">基地</a>
            <a href="#projects">星轨项目</a>
            <a href="#about">领航员</a>
        </nav>
    </header>

    <main>
        <section class="hero-section" id="home">
            <h1>探索未知的数字星空</h1>
            <p>欢迎来到我的个人引力场。这里记录着我在代码银河中的探索轨迹、构建的自动化工具，以及对技术边界的无限好奇。</p>
            <a href="#projects" class="cta-btn">启动推进器</a>
        </section>

        <section class="grid-container" id="projects">
            <div class="card">
                <span class="card-icon">🚀</span>
                <h3>星轨项目</h3>
                <p>探索各种自动化工具与独立开发项目。用代码作为燃料，在数字宇宙中搭建属于自己的空间站。</p>
            </div>

            <div class="card">
                <span class="card-icon">👾</span>
                <h3>游戏生态</h3>
                <p>专注于智能机器人与服务器自动化工具开发。让虚拟世界与算法逻辑碰撞出好玩的火花。</p>
            </div>

            <div class="card">
                <span class="card-icon">🛰️</span>
                <h3>技术日志</h3>
                <p>同步 GitHub 代码仓库，记录每一次的 Commit 漫游指南，捕获关于全栈开发的技术电波。</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NEBULA.IO. 由星际引力驱动。保持好奇，继续航行。</p>
    </footer>

</body>
</html>
